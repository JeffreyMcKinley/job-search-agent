name = "greenhouse_cover_letter"
description = """
Greenhouse path. Two things this case exists for: the iframe-token extraction
that gets the skill onto the real form URL, and the conditional in Step 4 --
this form HAS a cover letter field, so a cover letter must be generated (the
Lever case asserts the opposite).
"""
tags = ["greenhouse", "core"]
runs = 3

turns = [
  "/proficiently:apply https://boards.greenhouse.io/globex/jobs/4455667",
  "Looks good, fill it in. I'll handle the file uploads.",
  "Yes, submit.",
]

[[attachments]]
# The user attaches the resume PDF while reviewing the Step 6 summary, which is
# exactly what SKILL.md Step 7 tells them to do (MCP cannot upload PDFs).
turn = 2
label = "resume|cv"
value = "Jordan-Reyes-Resume.pdf"

[[attachments]]
turn = 2
label = "cover letter"
value = "Jordan-Reyes-Cover-Letter.pdf"

[[asserts]]
check = "skill_fired"
skill = "proficiently:apply"
critical = true

# Step 3: Greenhouse-specific navigation
[[asserts]]
name = "extracted_iframe_tokens"
check = "tool_called"
tool = "javascript_tool"

[[asserts]]
name = "reached_embed_form"
check = "field_set"
label = "first name"
value = "Jordan"

[[asserts]]
check = "no_nav_failures"

[[asserts]]
name = "read_before_fill"
check = "order"
before = "read_page"
after = "form_input"
critical = true

# Step 4: this form has a cover letter field, so one must exist
[[asserts]]
name = "cover_letter_generated"
check = "file_exists"
glob = ".proficiently/jobs/*/cover-letter.md"

[[asserts]]
name = "cover_letter_mentions_company"
check = "file_contains"
glob = ".proficiently/jobs/*/cover-letter.md"
pattern = "globex"

[[asserts]]
name = "tailored_resume_saved"
check = "file_exists"
glob = ".proficiently/jobs/*/resume.md"

# Step 6
[[asserts]]
name = "single_approval_before_fill"
check = "single_approval"
before_turn = 3
max = 1
critical = true

# Step 7: field mapping
[[asserts]]
name = "last_name_filled"
check = "field_set"
label = "last name"
value = "Reyes"

[[asserts]]
name = "email_filled"
check = "field_set"
label = "^email"
value = "jordan\\.reyes@example\\.com"

[[asserts]]
name = "previously_worked_no"
check = "field_set"
label = "previously worked"
value = "^No$"

[[asserts]]
name = "work_auth_yes"
check = "field_set"
label = "legally authorized"
value = "^Yes$"

[[asserts]]
name = "sponsorship_no"
check = "field_set"
label = "sponsorship"
value = "^No$"

[[asserts]]
name = "eeo_gender_declined"
check = "field_set"
label = "gender"
value = "decline"

[[asserts]]
name = "eeo_veteran_declined"
check = "field_set"
label = "veteran"
value = "not a protected veteran|wish to answer"

# Step 8
[[asserts]]
name = "filled_in_one_pass_after_approval"
check = "calls_in_turn"
turn = 2
tool = "form_input"
min = 8
critical = true

[[asserts]]
name = "no_submit_before_confirmation"
check = "not_clicked"
label = "submit"
before_turn = 3
critical = true

[[asserts]]
name = "submitted_after_confirmation"
check = "clicked"
label = "submit"

[[asserts]]
check = "no_validation_failures"

# Step 9
[[asserts]]
name = "applied_log_written"
check = "file_exists"
glob = ".proficiently/jobs/*/applied.md"

[[asserts]]
check = "max_calls"
max = 70
